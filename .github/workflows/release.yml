name: Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.3' }}
          name: "AirControl v1.3.3"
          body: |
            ### AirControl v1.3.3 更新内容
            - **电脑端 (`AirControl-macOS.zip`)**：解压后打开 `AirControl.app`，点击顶部菜单栏图标即可使用。
            - **手机端 (`AirControl.ipa`)**：支持 SideStore、AltStore、TrollStore 或爱思助手安装，已内置完整 iOS 桌面图标。
            - **核心改进**：
              1. 彻底攻克纯 Wi-Fi（包括联发科 `MTK_driverkit` 网卡）下的指针卡顿：双端主动 15ms (66Hz) 802.11 PM=0 网卡保活脉冲 + 彻底关闭 `awdl0` 切信道扫描 + 1-Packet 前向纠错（FEC）抗丢包 + 单线程 40µs 极速 `CGEvent` 注入；
              2. 修复唤醒失败（支持息屏后直接亮屏 + 绑定 `en0` 子网广播唤醒）及睡眠/锁屏/重启/关机全部电源动作；
              3. 优化键盘输入框体验：支持中文拼音与连续语音输入，点击「发送」后自动清空输入框。
          files: |
            dist/AirControl-macOS.zip
            dist/AirControl.ipa
          draft: false
          prerelease: false
          make_latest: "true"
