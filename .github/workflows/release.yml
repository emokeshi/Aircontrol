name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build macOS Host Agent
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
          cd apps/desktop-macos/build
          zip -qr9 AirControl-macOS.zip AirControl.app
          mkdir -p ../../../dist
          cp AirControl-macOS.zip ../../../dist/

      - name: Build iOS Application (.ipa)
        run: |
          chmod +x scripts/build-ipa.sh
          ./scripts/build-ipa.sh
          mkdir -p dist
          cp apps/mobile-ios/build/AirControl.ipa dist/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AirControl-macOS.zip
            dist/AirControl.ipa
            source.json
          draft: false
          prerelease: false
          generate_release_notes: true
