name: Release Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.2' }}
          name: "AirControl v1.3.2"
          body: |
            ### AirControl v1.3.2 更新内容
            - **电脑端 (`AirControl-macOS.zip`)**：解压后打开 `AirControl.app`，点击顶部菜单栏图标即可使用。
            - **手机端 (`AirControl.ipa`)**：支持 SideStore、AltStore、TrollStore 或爱思助手安装，已补齐 iOS 桌面图标。
            - **核心改进**：
              1. 解决纯 Wi-Fi 环境下半双工碰撞与微突发导致的指针卡顿（启用 802.11e WMM 语音级单路 UDP + 250Hz 抗抖动插值引擎）；
              2. 修复唤醒失败（支持息屏后直接亮屏 + 绑定 `en0` 子网广播唤醒）及睡眠/锁屏/重启/关机全部电源动作；
              3. 优化键盘输入框体验：支持拼音与连续语音输入，点击「发送」后自动清空输入框。
          files: |
            dist/AirControl-macOS.zip
            dist/AirControl.ipa
          draft: false
          prerelease: false
          make_latest: "true"
